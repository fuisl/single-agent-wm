defaults:
  - _self_
  - data: uav
  - model: lewm

output_model_name: lewm
run_dir: ${oc.env:WM_ROOT}/runs/lewm

seed: 3072
embed_dim: 192
history_size: 3
num_preds: 1

trainer:
  max_steps: 30000
  warmup_steps: 1000
  precision: bf16
  gradient_clip_val: 1.0
  log_every: 100
  val_every: 1000
  save_every: 5000

loader:
  batch_size: 128
  num_workers: 4
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True

optimizer:
  lr: 5e-5
  weight_decay: 1e-3

loss:
  state_weight: 1.0      # TokenJEPA / BeliefJEPA: next-state (proprio) prediction loss
  sigreg:
    weight: 0.09
    positions: 16        # TokenJEPA / BeliefJEPA: token positions per step (random subset)
    kwargs:
      knots: 17
      num_proj: 1024

hydra:
  run:
    dir: ${run_dir}/hydra

blind:                   # BeliefJEPA (M3): spans of frames with the image withheld from the belief
  prob: 0.0
  min: 2
  max: 12
